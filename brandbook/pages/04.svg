    <text x="34" y="50" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#2F6B58">COMBINAÇÕES APROVADAS</text>
    <rect x="34" y="84" width="292" height="74" rx="14" fill="#604174"/><text x="180" y="132" text-anchor="middle" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#FAF4E8">Ação principal · 7.65:1</text>
    <rect x="350" y="84" width="292" height="74" rx="14" fill="#EDE5F3"/><text x="496" y="132" text-anchor="middle" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#1D191E">Destaque · 14.13:1</text>
    <text x="34" y="216" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="18" fill="#1D191E">Texto principal sobre paper</text>
    <text x="642" y="216" text-anchor="end" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#2F6B58">13.91:1</text>
    <line x1="34" y1="238" x2="642" y2="238" stroke="#DCC9A7"/>
  </g>
  <g transform="translate(830 235)">
    <rect width="690" height="276" rx="26" fill="#FCF0F1" stroke="#F1D8DC"/>
    <text x="34" y="50" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9B3D47">NÃO USAR</text>
    <rect x="34" y="84" width="292" height="74" rx="14" fill="#EDE5F3"/><text x="180" y="132" text-anchor="middle" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" fill="#BFA6D2">Texto lavanda claro</text>
    <rect x="350" y="84" width="292" height="74" rx="14" fill="#BFA6D2"/><text x="496" y="132" text-anchor="middle" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" fill="#EDE5F3">Baixo contraste</text>
    <text x="34" y="216" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="18" fill="#9B3D47">Pastel não substitui contraste.</text>
    <text x="642" y="216" text-anchor="end" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="18" font-weight="700" fill="#9B3D47">REPROVADO</text>
    <line x1="34" y1="238" x2="642" y2="238" stroke="#F1D8DC"/>
  </g>
  <g transform="translate(80 555)">
    <text x="0" y="32" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#6B626D">CORES SEMÂNTICAS</text>
    <g transform="translate(0 70)"><rect width="330" height="122" rx="20" fill="#EFF7F2"/><circle cx="35" cy="34" r="10" fill="#2F6B58"/><text x="58" y="42" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#2F6B58">Sucesso</text><text x="26" y="88" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="15" fill="#1D191E">#2F6B58 · confirmação</text></g>
    <g transform="translate(370 70)"><rect width="330" height="122" rx="20" fill="#FCF6E8"/><circle cx="35" cy="34" r="10" fill="#7A5815"/><text x="58" y="42" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#7A5815">Atenção</text><text x="26" y="88" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="15" fill="#1D191E">#7A5815 · cautela</text></g>
    <g transform="translate(740 70)"><rect width="330" height="122" rx="20" fill="#FCF0F1"/><circle cx="35" cy="34" r="10" fill="#9B3D47"/><text x="58" y="42" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#9B3D47">Erro</text><text x="26" y="88" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="15" fill="#1D191E">#9B3D47 · falha</text></g>
    <g transform="translate(1110 70)"><rect width="330" height="122" rx="20" fill="#F0F6FA"/><circle cx="35" cy="34" r="10" fill="#365F7A"/><text x="58" y="42" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="19" font-weight="700" fill="#365F7A">Informação</text><text x="26" y="88" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="15" fill="#1D191E">#365F7A · contexto</text></g>
  </g>
  <text x="80" y="855" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="16" fill="#6B626D">Cor + rótulo + forma. Estado nunca depende apenas da cor.</text>
  <line x1="80" y1="944" x2="1520" y2="944" stroke="#DCC9A7" stroke-width="1"/>
  <text x="80" y="974" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="13" fill="#6B626D">SINAPSA. · DESIGN DIRECTION 0.8</text>
  <text x="1520" y="974" text-anchor="end" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="13" fill="#6B626D">04</text>
