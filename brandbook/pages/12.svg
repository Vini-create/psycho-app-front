  <text x="80" y="74" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#765292">11 · CARDS</text>
  <text x="80" y="154" font-family="STIX Two Text, Noto Serif, serif" font-size="64" font-weight="400" fill="#1D191E">Variações com função definida.</text>

  <g transform="translate(80 225)">
    <g><rect width="690" height="270" rx="18" fill="#FAF4E8" stroke="#DCC9A7"/><text x="28" y="44" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#765292">SURFACE · PAD 24 · R16</text><text x="28" y="104" font-family="STIX Two Text, Noto Serif, serif" font-size="30" font-weight="600" fill="#1D191E">Card funcional padrão</text><text x="28" y="150" font-family="STIX Two Text, Noto Serif, serif" font-size="18" fill="#1D191E">Agrupa conteúdo sem disputar atenção.</text><line x1="28" y1="190" x2="662" y2="190" stroke="#DCC9A7"/><text x="28" y="230" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#6B626D">paper-0 · border paper-200 · sem sombra</text></g>
    <g transform="translate(750 0)"><rect width="690" height="270" rx="24" fill="#EDE5F3"/><text x="28" y="44" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#604174">EDITORIAL · PAD 32 · R24</text><text x="28" y="112" font-family="STIX Two Text, Noto Serif, serif" font-size="40" font-style="italic" fill="#35223F">Uma pausa na leitura.</text><text x="28" y="164" font-family="STIX Two Text, Noto Serif, serif" font-size="18" fill="#35223F">Destaque de conteúdo, nunca ação crítica.</text><text x="28" y="226" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#604174">purple-100 · tipografia expressiva</text></g>
    <g transform="translate(0 310)"><rect width="690" height="270" rx="18" fill="#FAF4E8" stroke="#604174" stroke-width="2"/><text x="28" y="44" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#765292">INTERATIVO · MIN-H 144</text><text x="28" y="104" font-family="STIX Two Text, Noto Serif, serif" font-size="30" font-weight="600" fill="#1D191E">Título com destino claro</text><text x="28" y="150" font-family="STIX Two Text, Noto Serif, serif" font-size="18" fill="#1D191E">O foco envolve todo o card e a seta permanece visível.</text><text x="640" y="224" text-anchor="end" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="30" fill="#604174">→</text><text x="28" y="226" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#6B626D">focus ring 3px · alvo mínimo 44px</text></g>
    <g transform="translate(750 310)"><rect width="690" height="270" rx="18" fill="#1D191E"/><text x="28" y="44" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#BFA6D2">INVERSO · USO RESTRITO</text><text x="28" y="106" font-family="STIX Two Text, Noto Serif, serif" font-size="32" fill="#E7D7B8">Contraste para uma informação.</text><text x="28" y="154" font-family="STIX Two Text, Noto Serif, serif" font-size="18" fill="#E7D7B8">Não criar uma grade inteira de cards escuros.</text><line x1="28" y1="190" x2="662" y2="190" stroke="#514853"/><text x="28" y="230" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#BFA6D2">ink-900 · texto paper · semântica explícita</text></g>
