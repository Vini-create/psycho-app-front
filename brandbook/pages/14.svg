    <g transform="translate(570 35)"><rect width="260" height="150" rx="18" fill="#E7D7B8"/><text x="20" y="102" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#1D191E">Subtle</text><text x="20" y="130" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#1D191E">#E7D7B8</text></g>
    <g transform="translate(855 35)"><rect width="260" height="150" rx="18" fill="#1D191E"/><text x="20" y="102" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#E7D7B8">Ink</text><text x="20" y="130" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#BFA6D2">#1D191E</text></g>
    <g transform="translate(1140 35)"><rect width="300" height="150" rx="18" fill="#604174"/><text x="20" y="102" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="22" font-weight="700" fill="#FAF4E8">Primary</text><text x="20" y="130" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="12" fill="#EDE5F3">#604174</text></g>
