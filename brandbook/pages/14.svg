    <rect x="748" y="176" width="120" height="56" rx="12" fill="#FAF4E8" stroke="#604174" stroke-width="3"/><text x="808" y="211" text-anchor="middle" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="17" font-weight="700" fill="#604174">FOCO</text>
