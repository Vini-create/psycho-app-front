    <line y1="148" x2="430" y2="148" stroke="#DCC9A7"/>
    <text y="192" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="14" fill="#1D191E">ink-500 / canvas</text><text x="430" y="192" text-anchor="end" font-family="Source Code Pro, Noto Sans Mono, monospace" font-size="14" fill="#2F6B58">4.68:1</text>
