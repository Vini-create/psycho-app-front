<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#F1E5CD"/>

  <text x="80" y="74" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#765292">13 · LIGHT MODE</text>
  <text x="80" y="154" font-family="STIX Two Text, Noto Serif, serif" font-size="64" font-weight="400" fill="#1D191E">Papel, não branco.</text>

  <text x="80" y="205" font-family="STIX Two Text, Noto Serif, serif" font-size="20" fill="#6B626D">Superfícies quentes preservam a estética editorial sem reduzir contraste.</text>
