    <text x="28" y="100" font-family="STIX Two Text, Noto Serif, serif" font-size="30" font-weight="600" fill="#1D191E">Título principal do card</text>
    <text x="28" y="140" font-family="STIX Two Text, Noto Serif, serif" font-size="18" fill="#1D191E">Texto de leitura usa ink-900. Apoio usa ink-500.</text>
