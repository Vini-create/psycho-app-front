  <text x="80" y="154" font-family="STIX Two Text, Noto Serif, serif" font-size="64" font-weight="400" fill="#1D191E">Marfim, tinta e lavanda.</text>

  <text x="82" y="206" font-family="Nimbus Sans Narrow, Arial Narrow, Noto Sans, sans-serif" font-size="21" fill="#6B626D">Canvas newsprint #F1E5CD. O roxo orienta. O off-black sustenta.</text>
